name: Feature request
description: An idea to make Bootdeck more useful.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would it solve?
      description: Describe your routine and what is missing or painful today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like Bootdeck to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: How do you work around it today?
